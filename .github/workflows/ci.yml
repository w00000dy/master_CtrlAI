name: CI

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions:
  contents: read

env:
  DISABLE_ERD: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-node

      - name: Run local linting (ESLint, Biome, Stylelint)
        run: |
          npm run lint
          npm run stylelint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-node

      - name: Run tests
        run: npm run test
