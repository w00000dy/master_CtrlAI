name: CI

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions:
  contents: read

env:
  DISABLE_ERD: "true"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-node

      - name: Run local linting (ESLint, Biome, Stylelint)
        run: |
          npm run lint
          npm run stylelint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-node

      - name: Run tests
        run: npm run test
